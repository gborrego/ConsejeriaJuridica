services:
    apiusuarios:
        build: ./API-Usuario/
        ports:
            - "3002:3002"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db-compartida

    apicodigopostal:
        build: ./API-Codigo-Postal/
        ports:
            - "3012:3012"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db-compartida

    apidemanda:
        build: ./API-Demanda/
        ports:
            - "3026:3026"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db-compartida

    apiasesoria:
        build: ./API-Asesoria/
        ports:
            - "3009:3009"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db-compartida

    appdemanda:
        build: ./APP-WEB-Demanda/
        ports:
            - "3032:3030"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db-compartida

    appasesorias:
        build: ./APP-WEB-Asesoria/
        ports:
            - "3034:3030"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - db-compartida

    db-compartida:
        image: mysql:latest
        ports:
            - "3306:3306"
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./Bases-de-Datos-Testing:/docker-entrypoint-initdb.d/
            - ./Bases-de-Datos-Testing/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf
